# Loading the colors provided by pywal
source = ~/.config/hypr/wal-theme.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,preferred,auto,auto
monitor=desc:Microstep G272QPF E2 0x01010101,2560x1440@60.00,auto-center-left,1.25
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = alacritty
$browser = firefox
$wallpaperManager = wpaperd

#################
### AUTOSTART ###
#################

# Starting clipse, the clipboard manager
exec-once = clipse -listen
windowrule {
    name = clipse-master-mod
    match:class = clipse

    size = 622 652
    float = true
}

# STARTING MISC PROGRAMS
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle

# Start the script that fetches the current state of updates to be displayed in waybar
# NOTE: The sleep part is important, otherwise the waybar gets killed sometimes for some reason
exec-once = sleep 1 && ~/.config/waybar/scripts/count-updates.sh

exec-once = waybar
exec-once = $wallpaperManager
exec-once = $terminal

exec-once = ~/arch_setup/auto_backup.sh

# This actually slows the entire laptop down
#exec-once = mpvpaper -o "loop=inf" DP-4 "~/Images/Wallpapers/2560x1440 broken-window.mp4"

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

$CURSOR_SIZE = 16
env = XCURSOR_SIZE,$CURSOR_SIZE
env = HYPRCURSOR_SIZE,$CURSOR_SIZE


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

ecosystem {
	enforce_permissions = 1
	no_update_news = true
	no_donation_nag = true
}

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4, 8, 8, 8

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color15 # Bright White
    col.inactive_border = $color8 # Bright Black

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 5
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2 # This makes sure that, if the split is gonna be happening to the sides, it is always to the right side. Does not affect splits on the top or bottom
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true

    size_limits_tiled = true # This allows tiled windows to also have a min/max size FIX: Does not seem to work?
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = de,dk
    kb_variant =
    kb_model =
    # kb_options = grp:lalt_lshift_toggle
    kb_options = grp:win_space_toggle
    kb_rules =

    repeat_rate = 40
    repeat_delay = 400

    follow_mouse = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
# EXP: Taken from the default config, no Idea what this does
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# CUSTOM SHIT
debug {
	disable_logs = false
}

cursor {
	no_warps = true # This makes the cursor not appear in the center of the window when focusing it
	hide_on_key_press = true
	no_hardware_cursors = 1 # without this, the cursors constantly disappears when using a second monitor
	default_monitor = DP-4
}

opengl {
	nvidia_anti_flicker = false # This is on per default, but can cause FPS drops on low-end GPUs -- like my builtin Intel CPU. 	
}

# This makes sure that xwayland apps (like the android studio emulator) are not blurry
xwayland {
    force_zero_scaling = true
}


# This makes filepickers used for uploading files in firefox be tiled rather than floating
windowrule {
    name = firefox-tiled-fileupload
    match:class = ^(firefox)$
    match:title = ^(File Upload)(.*)$
    tile = true
}

# EXP: Trying to fix the issue where floating windows are bigger than the screen
# FIX: But it doesn't work
# bind = $mainMod, T, exec, ~/.config/hypr/scripts/auto-resize.sh

# Fixing obsidian behaviour FIX: Doesnt work
windowrule {
    name = obsidian-tiled
    match:initial_class = ^(obsidian)$
    tile = true
}

# Making Godot game debug window run as float FIX: Doesnt work, maybe because title regex isnt good enough
windowrule {
    name = godot-float-debugger
    match:initial_title = ^(Godot)$
    match:title = ^(.*)\(DEBUG\)(.*)$
    float = true
}

# NOTE: Waydroid should float, otherwise it's sizing is unfortunately just fucked
windowrule {
    name = waydroid-fixed-size
    # NOTE: That, depending on how it's launched, there are these two types of classes for waydroid
    match:class = ^(Waydroid)|(waydroid.*)$

    float = true

    # Moving it to the right of the screen
    move = monitor_w-320 75

    # tile = true
    # no_max_size = false
    # max_size = 350 9999
}

# EXP: Was hoping this would remove the window bar, but it doesnt
windowrule {
    name = android-studio-no-decorations
    match:class = jetbrains-studio

    decorate = false
}

# Giving neovim slightly transparent. NOTE: that this affects not only the background, but the entire application
windowrule {
    name = neovim-transparency
    match:title = ^(neovim)$
    opacity = 0.9
}

# Load custom modular extensions (they are simply sperated for better readability)
source = ~/.config/hypr/modules/*



### PERMISSIONS
permission = /usr/bin/hyprlock, screencopy, allow
permission = /usr/bin/grim, screencopy, allow
